<header>
<nav aria-label="Main Navigation">
<ul>

<li><a href="about.html">About</a></li>
<li><a href="contact.html" aria-current="page">Contact</a></li>
</ul>
</nav>
</header>

<main>
<section aria-labelledby="contact-heading">
<h1 id="contact-heading">Get in Touch</h1>

<form action="/submit" method="POST">
<div>
<label for="fullName">Full Name</label>
<input type="text" id="fullName" name="fullName" required aria-required="true">
</div>

<div>
<label for="emailAddress">Email Address</label>
<input type="email" id="emailAddress" name="emailAddress" required aria-required="true">
</div>

<div>
<label for="messageBody">Message</label>
<textarea id="messageBody" name="messageBody" rows="5" required aria-required="true"></textarea>
</div>

<button type="submit">Send Message</button>
</form>

</section>
</main>

</footer>

</body>
